[project]
name = "sweetiebot"
version = "9.1"
requires-python = "==3.11.*"
dependencies = [
  "astral==1.6",
  "beautifulsoup4>=4.13",
  "requests==2.20.0",
  "pytz>=2016.4",
  "psycopg2-binary>=2.9.9",
  "slixmpp==1.7.0",
  "opencensus-ext-azure==1.0.4",
  "laboratory==1.0.2",
]

[tool.uv]
package = false

[tool.uv.extra-build-dependencies]
# legacy sdists with no declared build backend; setuptools is needed to build their wheels
slixmpp = ["setuptools"]

[dependency-groups]
dev = [
  "black>=26.5.1",
  "flake8>=7.4.1",
  "mypy>=2.3.1",
  "types-beautifulsoup4>=4.12.0.20250516",
  "types-psycopg2>=2.9.21.20260911",
  "types-pytz>=2026.4.0.20260926",
  "types-requests>=2.31.0.6",
]

[tool.mypy]
python_version = "3.11"
strict = true
# names imported into package __init__ files are the packages' public API
implicit_reexport = true
# functions commonly fall through to an implicit `return None`
warn_no_return = false
# variables are commonly reassigned with values of a different type
allow_redefinition = true
# slixmpp and parsed JSON responses are untyped, so many values are Any
warn_return_any = false
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
# no type information published for these packages
module = ["slixmpp.*", "slixmpp", "laboratory", "astral", "opencensus.*"]
ignore_missing_imports = true
